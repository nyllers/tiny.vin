<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tiny.vin — URL Statistics</title>
  <meta name="description" content="View redirect statistics for the tiny URLs you've created on tiny.vin.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <div class="site-nav"></div>
  <div class="theme-toggle" role="group" aria-label="Theme"></div>
  <div class="donate-nav"></div>
  <script src="header.js"></script>
  <h2 class="section-heading">URL STATISTICS</h2>
  <section class="stats-summary" id="stats-summary"></section>
  <section class="history-panel" id="stats-panel">
    <div id="stats-list"></div>
  </section>
  <p class="legal-links"><a href="/privacy.html">Privacy Policy</a> &middot; <a href="/terms.html">Terms of Service</a></p>
  <footer>Simple project by Anders &amp; Claude &middot; v105</footer>
  <div class="modal-overlay" id="chart-modal-overlay" hidden>
    <div class="modal modal--wide" role="dialog" aria-modal="true" aria-labelledby="chart-modal-title">
      <p class="modal-title" id="chart-modal-title"></p>
      <div class="chart-modal-body" id="chart-modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn--cancel" id="chart-modal-close">Close</button>
      </div>
    </div>
  </div>
  <script src="cards.js"></script>
  <script src="charts.js"></script>
  <script src="world-map-path.js"></script>
  <script src="stats.js"></script>
  <script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js" charset="UTF-8" onload="renderDonateButton()"></script>
</body>
</html>
