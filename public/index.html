<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tiny.vin</title>
  <meta name="description" content="tiny.vin is a simple URL-shortening tool. Signing in with Google lets us identify your account by your Google email address and name, so you can create, view, and delete your own tiny URLs. No other data is requested, and anyone can follow a tiny URL without signing in.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tiny.vin">
  <meta property="og:site_name" content="tiny.vin">
  <meta property="og:title" content="tiny.vin">
  <meta property="og:description" content="tiny.vin is a simple URL-shortening tool. Signing in with Google lets us identify your account by your Google email address and name, so you can create, view, and delete your own tiny URLs. No other data is requested, and anyone can follow a tiny URL without signing in.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <div class="site-nav">
    <button type="button" class="nav-toggle" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="wordmark" href="/">tin<span class="accent-dot">y.v</span>in</a>
    <nav class="nav-dropdown" hidden>
      <a class="nav-link" href="/">
        <svg class="nav-link-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>URLs</span>
      </a>
      <a class="nav-link" href="/stats">
        <svg class="nav-link-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="20" x2="6" y2="14"></line>
          <line x1="12" y1="20" x2="12" y2="10"></line>
          <line x1="18" y1="20" x2="18" y2="4"></line>
        </svg>
        <span>Statistics</span>
      </a>
      <a class="nav-link nav-link--signout" href="/auth/logout">
        <svg class="nav-link-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sign out</span>
      </a>
    </nav>
  </div>
  <div class="theme-toggle" role="group" aria-label="Theme">
    <button type="button" class="theme-btn" data-theme-value="light">Light</button>
    <button type="button" class="theme-btn" data-theme-value="dark">Dark</button>
  </div>
  <h2 class="section-heading">ADD URL</h2>
  <main class="generate-section">
    <div class="controls">
      <input type="text" id="url-input" placeholder="Paste or write a URL">
      <button id="generate-btn">Make it Tiny</button>
    </div>
    <p id="url-result"></p>
  </main>
  <section class="history-panel" id="history-panel">
    <div id="history-list"></div>
  </section>
  <p class="legal-links"><a href="/privacy.html">Privacy Policy</a> &middot; <a href="/terms.html">Terms of Service</a></p>
  <footer>Simple project by Anders &amp; Claude &middot; v44</footer>
  <div class="modal-overlay" id="delete-modal-overlay" hidden>
    <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="delete-modal-title" aria-describedby="delete-modal-message">
      <p class="modal-title" id="delete-modal-title">Delete this tiny URL?</p>
      <p class="modal-message" id="delete-modal-message"></p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn--cancel" id="delete-modal-cancel">Cancel</button>
        <button type="button" class="modal-btn modal-btn--confirm" id="delete-modal-confirm">Delete</button>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="qr-modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="qr-modal-title">
      <p class="modal-title" id="qr-modal-title">QR Code</p>
      <div class="qr-modal-image" id="qr-modal-image"></div>
      <p class="qr-modal-url" id="qr-modal-url"></p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn--cancel" id="qr-modal-close">Close</button>
      </div>
    </div>
  </div>
  <script src="cards.js"></script>
  <script src="qrcode-lib.js"></script>
  <script src="script.js"></script>
  <script src="theme.js"></script>
  <script src="nav.js"></script>
</body>
</html>
