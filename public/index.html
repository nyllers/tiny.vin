<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny VIN</title>
  <meta name="description" content="Tiny VIN is a simple link-shortening tool. Signing in with Google lets us identify your account by your Google email address and name, so you can create, view, and delete your own short links. No other data is requested, and anyone can follow a shortened link without signing in.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tiny.vin">
  <meta property="og:site_name" content="Tiny VIN">
  <meta property="og:title" content="Tiny VIN">
  <meta property="og:description" content="Tiny VIN is a simple link-shortening tool. Signing in with Google lets us identify your account by your Google email address and name, so you can create, view, and delete your own short links. No other data is requested, and anyone can follow a shortened link without signing in.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <div class="controls">
      <input type="text" id="url-input" placeholder="Paste or write the long URL">
      <button id="generate-btn">Tiny URL</button>
    </div>
    <p id="url-result"></p>
  </main>
  <section class="panel history-panel">
    <h2 class="section-heading">Previously generated</h2>
    <div id="history-list"></div>
  </section>
  <p class="signout-row"><a href="/auth/logout">Sign out</a></p>
  <p class="legal-links"><a href="/privacy.html">Privacy Policy</a> &middot; <a href="/terms.html">Terms of Service</a></p>
  <footer>Simple project by Anders &amp; Claude &middot; v17</footer>
  <div id="edit-modal-backdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <h2 id="edit-modal-title" class="modal-title">Edit short URL</h2>
      <div class="modal-field">
        <span class="url-card-label">Original URL</span>
        <p id="edit-modal-original" class="modal-value"></p>
      </div>
      <div class="modal-field">
        <span class="url-card-label">Short URL</span>
        <p id="edit-modal-short" class="modal-value"></p>
      </div>
      <div class="modal-field">
        <label for="edit-modal-suffix" class="url-card-label">Add another short URL</label>
        <div class="modal-suffix-row">
          <span class="modal-suffix-prefix">tiny.vin/</span>
          <input type="text" id="edit-modal-suffix" placeholder="banana">
        </div>
        <p id="edit-modal-error" class="modal-error"></p>
      </div>
      <div class="modal-actions">
        <button type="button" id="edit-modal-cancel" class="modal-btn modal-btn-secondary">Cancel</button>
        <button type="button" id="edit-modal-save" class="modal-btn modal-btn-primary">Save</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
